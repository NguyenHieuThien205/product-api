name: Product API CD - Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/productdb_ci

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CRUD tests
        run: npm test

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }} \
            .

      - name: Run Docker container for healthcheck
        run: |
          docker run -d \
            --name product-api-ci \
            --network host \
            -e PORT=3000 \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/productdb_ci \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi
            echo "Waiting for Product API..."
            sleep 2
          done

          echo "Product API healthcheck failed"
          docker logs product-api-ci
          exit 1

      - name: Stop test container
        if: always()
        run: |
          docker stop product-api-ci || true
          docker rm product-api-ci || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
